  // Intro-Texte, die beim Aufklappen bestimmter Gruppen über den Karten erscheinen
  const GROUP_INTROS = {
    "Setup::Gaming::Mikrofon-Arm": "Beide Arme tragen das schwere Shure SM7dB sicher — Geschmackssache. XLR-Kabel und Audio-Interface stecken als Zubehör beim Mikrofon selbst; ein Popfilter liegt dem SM7dB bei, ein Cloudlifter ist unnötig (Vorverstärker eingebaut).",
    "Körperliches::::Uhr": "Wichtig zu wissen: Das hier sind bewusst nur <b>Beispiele</b>. Es geht mir eigentlich darum, dass ich am liebsten eine schöne Edelstahl-Uhr mit schwarzem, cleanem Zifferblatt hätte — welche genau, ist noch offen. Insgesamt ist das eher ein größerer Traum."
  };

  // Rendert eine Karte samt optionalem, aufklappbarem Zubehör (Items mit subOf === i.id)
  function renderWithSubs(i, hidePriority){
    const subs = items.filter(s => s.subOf === i.id);
    if (subs.length === 0) return renderCard(i, null, hidePriority);
    const skey = 'sub::' + i.id;
    const sOpen = expandedGroups.has(skey);
    let h = renderCard(i, { count: subs.length, isOpen: sOpen, key: skey }, hidePriority);
    if (sOpen){
      h += `<div class="group-items">`;
      subs.forEach(s => { h += renderCard(s, null, hidePriority); });
      h += `</div>`;
    }
    return h;
  }

  function renderItemsAndGroups(list, hidePriority){
    hidePriority = hidePriority || false;
    let html = '';
    const PRIO_ORDER = { must: 0, nice: 1, dream: 2 };
    // Zubehör mit subOf hängt an seinem Hauptprodukt, nicht als eigene Karte in der Liste
    list = list.filter(i => !i.subOf);
    // Einzelprodukte UND Gruppen werden als gemeinsame "Einheiten" sortiert — nur so
    // kann z.B. der Plattenspieler zwischen Fernseher und Aktivlautsprechern stehen.
    const seenG = {};
    const units = [];
    list.forEach(i => {
      if (i.group){
        if (!seenG[i.group]){ seenG[i.group] = { group: i.group, items: [] }; units.push(seenG[i.group]); }
        seenG[i.group].items.push(i);
      } else {
        units.push({ item: i });
      }
    });
    const uItems = u => u.item ? [u.item] : u.items;
    const uOrder = u => Math.min(...uItems(u).map(itemOrder));
    const uPrio  = u => Math.min(...uItems(u).map(i => PRIO_ORDER[i.priority]));
    const uPrice = u => uItems(u).reduce((s,i) => s + (Number(i.price)||0), 0);
    const uId    = u => Math.min(...uItems(u).map(i => i.id));
    units.sort((a,b) => {
      if (sortMode === 'prio') return (uPrio(a)-uPrio(b)) || (uOrder(a)-uOrder(b)) || (uId(a)-uId(b));
      if (sortMode === 'asc')  return (uPrice(a)-uPrice(b)) || (uId(a)-uId(b));
      if (sortMode === 'desc') return (uPrice(b)-uPrice(a)) || (uId(a)-uId(b));
      return (uOrder(a)-uOrder(b)) || (uId(a)-uId(b));   // Standard: logische Reihenfolge
    });

    units.forEach(u => {
      if (u.item){ html += renderWithSubs(u.item, hidePriority); return; }
      const g = u.group;
      // Auch INNERHALB einer Gruppe logisch sortieren (z.B. PC: Gehäuse → Mainboard → CPU …)
      const groupItems = u.items.slice().sort((a,b) => (itemOrder(a)-itemOrder(b)) || (a.id-b.id));
      const key = groupKey(groupItems[0]);
      const isOpen = expandedGroups.has(key);
      const groupSum = groupItems.reduce((s,i) => s + (Number(i.price)||0), 0);
      // Für Alternativen-Gruppen: Preis-Spanne statt Summe (man kauft nur eine Option)
      const altPrices = groupItems.filter(i => i.price !== null && i.price !== undefined && i.price !== '').map(i => Number(i.price));
      const altRange = altPrices.length === 0 ? '—'
        : (Math.min(...altPrices) === Math.max(...altPrices) ? money(Math.min(...altPrices))
        : money(Math.min(...altPrices)) + '–' + money(Math.max(...altPrices)));
      const gDone = groupItems.every(i => purchased.has(i.id));
      const gCheck = `<button class="group-check ${gDone ? 'done' : ''}" onclick="toggleGroupDone('${key}', event)" aria-label="${gDone ? 'Gruppe wieder als offen markieren' : 'Ganze Gruppe abhaken'}" title="${gDone ? 'Gruppe wieder öffnen' : 'Ganze Gruppe abhaken'}"><span class="cb-diamond"><span>✓</span></span></button>`;
      const kind = classifyGroup(groupItems);

      if (kind.type === 'main-accessory'){
        html += renderCard(kind.main, { count: kind.accessories.length, isOpen, key }, hidePriority);
        if (isOpen){
          html += `<div class="group-items">`;
          kind.accessories.forEach(i => { html += renderWithSubs(i, hidePriority); });
          html += `</div>`;
        }
      } else if (kind.type === 'alternatives'){
        html += `<div class="group-block">
          <div class="group-header alt-header ${gDone ? 'all-done' : ''}" onclick="toggleGroup('${key}')" role="button" tabindex="0" aria-expanded="${isOpen}">
            <div class="group-header-left">
              <span class="chevron ${isOpen ? 'open':''}">▸</span>
              <span class="alt-icon">⇄</span>
              <span class="group-name">${escapeHtml(g)}</span>
              <span class="group-count alt-count">${groupItems.length} Optionen · alle okay, noch nicht entschieden</span>
            </div>
            <span style="display:flex;align-items:center;gap:12px;">${gCheck}<span class="group-sum mono" title="Preis-Spanne der Optionen — zählt nur einmal zur Summe">${altRange}</span></span>
          </div>`;
        if (isOpen){
          html += `<div class="group-items">`;
          if (GROUP_INTROS[key]) html += `<div class="group-intro">${GROUP_INTROS[key]}</div>`;
          groupItems.forEach(i => { html += renderWithSubs(i, hidePriority); });
          html += `</div>`;
        }
        html += `</div>`;
      } else {
        html += `<div class="group-block">
          <div class="group-header ${gDone ? 'all-done' : ''}" onclick="toggleGroup('${key}')" role="button" tabindex="0" aria-expanded="${isOpen}">
            <div class="group-header-left">
              <span class="chevron ${isOpen ? 'open':''}">▸</span>
              <span class="group-name">${escapeHtml(g)}</span>
              <span class="group-count">${groupItems.length} Teile</span>
            </div>
            <span style="display:flex;align-items:center;gap:12px;">${gCheck}<span class="group-sum mono">${money(groupSum)}</span></span>
          </div>`;
        if (isOpen){
          html += `<div class="group-items">`;
          if (GROUP_INTROS[key]) html += `<div class="group-intro">${GROUP_INTROS[key]}</div>`;
          groupItems.forEach(i => { html += renderWithSubs(i, hidePriority); });
          html += `</div>`;
        }
        html += `</div>`;
      }
    });
    return html;
  }

  function classifyGroup(groupItems){
    const accessories = groupItems.filter(i => i.note && i.note.indexOf('Zubehör') !== -1);
    const mainCandidates = groupItems.filter(i => !(i.note && i.note.indexOf('Zubehör') !== -1));
    if (accessories.length > 0 && mainCandidates.length === 1){
      return { type: 'main-accessory', main: mainCandidates[0], accessories };
    }
    const allOptions = groupItems.every(i => i.alternative === true || (i.note && i.note.indexOf('Test-Option') === 0));
    if (allOptions){
      return { type: 'alternatives' };
    }
    return { type: 'generic' };
  }

  function groupKey(item){
    return `${item.category}::${item.subcategory||''}::${item.group||''}`;
  }

  // Logische Reihenfolge: kleinere Zahl = weiter oben (Fundament zuerst).
  // Ohne Angabe landet ein Eintrag hinten und behält dort seine bisherige Reihenfolge.
  function itemOrder(i){ return (i.order !== null && i.order !== undefined) ? i.order : 900; }

  // Repräsentativer Preis einer Alternativen-Gruppe: Durchschnitt der Optionen mit Preis.
  function altGroupPrice(groupItems){
    const priced = groupItems.filter(i => i.price !== null && i.price !== undefined && i.price !== '');
    if (!priced.length) return 0;
    return priced.reduce((s,i) => s + Number(i.price), 0) / priced.length;
  }

  // Geschätzte Summe einer Item-Menge. Alternativen-Gruppen ("noch nicht entschieden")
  // zählen nur EINMAL (Durchschnitt der Optionen) — man kauft am Ende nur eine davon.
  // remaining=true: nur offene Posten; eine Alternativen-Gruppe gilt als erledigt,
  // sobald irgendeine ihrer Optionen abgehakt ist.
  function estimateSum(list, remaining){
    const groups = {};
    list.forEach(i => {
      if (!i.group) return;
      const k = groupKey(i);
      (groups[k] = groups[k] || []).push(i);
    });
    const altKeys = new Set();
    Object.keys(groups).forEach(k => {
      if (classifyGroup(groups[k]).type === 'alternatives') altKeys.add(k);
    });
    let total = 0;
    list.forEach(i => {
      if (i.group && altKeys.has(groupKey(i))) return; // Alternativen separat behandelt
      if (remaining && purchased.has(i.id)) return;
      total += Number(i.price) || 0;
    });
    altKeys.forEach(k => {
      const gi = groups[k];
      if (remaining && gi.some(i => purchased.has(i.id))) return; // Entscheidung getroffen
      total += altGroupPrice(gi);
    });
    return total;
  }

  function toggleGroup(key){
    if (expandedGroups.has(key)) expandedGroups.delete(key);
    else expandedGroups.add(key);
    renderLists();
  }

  function renderCard(i, accessoryInfo, hidePriority){
    accessoryInfo = accessoryInfo || null;
    hidePriority = hidePriority || false;
    const isDone = purchased.has(i.id);
    const isSeries = i.note && i.note.indexOf('Alle aktuell erschienenen Bände gewünscht') !== -1;
    const imgUrl = ITEM_IMAGES[i.id];
    const remoteUrl = REMOTE_IMAGES[i.id];
    const monoSrc = i.title.indexOf(': ') !== -1 ? i.title.split(': ')[1] : i.title;
    const initial = (monoSrc.trim().charAt(0) || '?').toUpperCase();
    const remoteAttr = (remoteUrl && remoteUrl !== imgUrl) ? ` data-remote="${escapeHtml(remoteUrl)}"` : '';
    const thumb = imgUrl
      ? `<button class="thumb" onclick="openLightbox(${i.id})" aria-label="Produktbild ansehen"><img src="${escapeHtml(imgUrl)}" alt="" loading="lazy" data-initial="${escapeHtml(initial)}"${remoteAttr} onerror="thumbFallback(this)"></button>`
      : `<div class="thumb thumb-mono" aria-hidden="true">${escapeHtml(initial)}</div>`;
    return `
      <div class="card ${isDone ? 'done' : ''}" data-id="${i.id}">
        <button class="checkbox ${isDone ? 'done' : ''}" onclick="togglePurchased(${i.id})" aria-label="${isDone ? 'Wieder als offen markieren' : 'Als erledigt abhaken'}" title="${isDone ? 'Wieder als offen markieren' : 'Abhaken'}"><span class="cb-diamond"><span>✓</span></span></button>
        ${thumb}
        <div class="card-body">
          <div class="item-top">
            <div class="item-title">${markHits(escapeHtml(i.title))}${isSeries ? ' <span class="series-badge">ganze Serie · DE/EN · TB/HC</span>' : ''}</div>
            <div class="price-meta">
              <div class="item-price">${i.priceTo ? money(i.price) + '–' + money(i.priceTo) : money(i.price)}</div>
              ${i.priceUpdated ? `<div class="price-checked">Preis geprüft: ${formatDate(i.priceUpdated)}</div>` : ''}
              ${isDone && purchaseDates[i.id] ? `<div class="done-date">abgehakt am ${formatDate(purchaseDates[i.id])}</div>` : ''}
            </div>
          </div>
          ${i.note ? `<div class="item-note">${markHits(escapeHtml(i.note))}</div>` : ''}
          <div class="item-tags">
            ${hidePriority ? '' : `<span class="prio-tag ${PRIO_CLASS[i.priority]}">${PRIO_LABEL[i.priority]}</span>`}
            ${i.link ? `<a class="link-btn" href="${escapeHtml(i.link)}" target="_blank" rel="noopener">${escapeHtml(i.linkLabel || 'Zum Produkt')} ↗</a>` : ''}
            ${i.link2 ? `<a class="link-btn" href="${escapeHtml(i.link2)}" target="_blank" rel="noopener">${escapeHtml(i.link2Label || 'Zweiter Link')} ↗</a>` : ''}
            ${accessoryInfo ? `<button class="accessory-toggle-btn" onclick="toggleGroup('${accessoryInfo.key}')">${accessoryInfo.isOpen ? 'Zubehör ausblenden' : `+ ${accessoryInfo.count} Zubehör`}</button>` : ''}
          </div>
        </div>
      </div>`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    renderTabs();
    renderLedger();
    renderLists();
    renderStarter();
  }

  try {
    const h = decodeURIComponent(location.hash.slice(1));
    if (CATEGORIES.includes(h)) activeTab = h;
  } catch (e) {}

  render();
  updateFilterUI();
  applyCompact();

  // --- Scroll: Fortschrittsbalken, Scroll-Top, Mini-Fortschritt, Hero-Parallax ---
  const _scrollProgress = document.getElementById('scrollProgress');
  const _scrollTop = document.getElementById('scrollTop');
  const _mini = document.getElementById('miniProgress');
  const _heroBg = document.getElementById('heroBg');
  const _heroGlow = document.getElementById('heroGlow');
  const _heroInner = document.querySelector('.hero-inner');
  const _reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let _ticking = false;
  function onScroll(){
    const y = window.scrollY;
    const docH = document.documentElement.scrollHeight - window.innerHeight;
    _scrollProgress.style.width = (docH > 0 ? (y / docH) * 100 : 0) + '%';
    const deep = y > 600;
    _scrollTop.classList.toggle('show', deep);
    _mini.classList.toggle('show', deep);
    if (!_reduced && y < 900){
      _heroBg.style.transform = 'translate3d(0,' + (y * 0.28) + 'px,0) scale(1.06)';
      _heroGlow.style.transform = 'translate3d(0,' + (y * 0.5) + 'px,0)';
      if (_heroInner) _heroInner.style.transform = 'translate3d(0,' + (y * -0.06) + 'px,0)';
    }
    _ticking = false;
  }
  window.addEventListener('scroll', function(){
    if (!_ticking){ _ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });
  onScroll();

  // --- Cursor-Lichtkegel + Karten-Spotlight + magnetische Buttons ---
  const _cursorGlow = document.getElementById('cursorGlow');
  const _hasFinePointer = window.matchMedia('(pointer: fine)').matches;
  if (!_reduced && _hasFinePointer){
    let _cgRaf = false, _cgx = 0, _cgy = 0;
    document.addEventListener('pointermove', function(e){
      // globaler Lichtkegel
      _cgx = e.clientX; _cgy = e.clientY;
      if (!_cgRaf){
        _cgRaf = true;
        requestAnimationFrame(function(){
          _cursorGlow.style.setProperty('--cx', _cgx + 'px');
          _cursorGlow.style.setProperty('--cy', _cgy + 'px');
          _cursorGlow.classList.add('on');
          _cgRaf = false;
        });
      }
      // Karten-Spotlight
      const el = e.target.closest && e.target.closest('.card');
      if (el){
        const r = el.getBoundingClientRect();
        el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        el.style.setProperty('--my', (e.clientY - r.top) + 'px');
      }
      // magnetische Buttons (nur in Cursor-Nähe)
      const mag = e.target.closest && e.target.closest('.magnetic');
      if (mag){
        const r = mag.getBoundingClientRect();
        const dx = (e.clientX - (r.left + r.width / 2)) * 0.28;
        const dy = (e.clientY - (r.top + r.height / 2)) * 0.4;
        mag.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      }
    }, { passive: true });
    document.addEventListener('pointerout', function(e){
      if (e.target.closest && e.target.closest('.magnetic') && (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.magnetic'))){
        e.target.closest('.magnetic').style.transform = '';
      }
    }, { passive: true });
    document.addEventListener('mouseleave', function(){ _cursorGlow.classList.remove('on'); });
  }

  // --- Intro-Ladesequenz ausblenden (übergibt an den Hero) ---
  (function(){
    const intro = document.getElementById('intro');
    if (!intro) return;
    if (_reduced){ intro.remove(); return; }
    let seen = false;
    try { seen = sessionStorage.getItem('nzh-intro') === '1'; } catch (e) {}
    if (seen){ intro.remove(); return; }
    try { sessionStorage.setItem('nzh-intro', '1'); } catch (e) {}
    setTimeout(function(){ intro.classList.add('done'); }, 1150);
    setTimeout(function(){ intro.remove(); }, 1950);
  })();


  function jumpToStats(){
    const body = document.getElementById('statsBody');
    if (body.style.display === 'none') toggleStats();
    document.querySelector('.stats').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  // --- Sanfte Zähl-Animation beim Laden (Ledger-Zahlen + Ring) ---
  function countUp(el, to, isMoney){
    if (!el) return;
    const dur = 900, t0 = performance.now();
    const fmt = v => isMoney ? money(Math.round(v)) : String(Math.round(v));
    function step(now){
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(to * eased);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = fmt(to);
    }
    requestAnimationFrame(step);
  }
  function introCounts(){
    const restSum = estimateSum(items, true);
    const vals = document.querySelectorAll('#ledger .ledger-item .value');
    countUp(vals[0], items.length, false);
    countUp(vals[1], items.length - purchased.size, false);
    countUp(vals[2], purchased.size, false);
    countUp(vals[3], restSum, true);
    countUp(document.getElementById('ringNum'), purchased.size, false);
  }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    updateHero();
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) introCounts();
  }));

  // --- Produktbild-Lightbox ---
  function thumbFallback(img){
    const remote = img.getAttribute('data-remote');
    if (remote){
      img.removeAttribute('data-remote');
      img.src = remote;
      return;
    }
    const d = document.createElement('div');
    d.className = 'thumb thumb-mono';
    d.setAttribute('aria-hidden', 'true');
    d.textContent = img.getAttribute('data-initial') || '?';
    img.closest('.thumb').replaceWith(d);
  }
  function openLightbox(id){
    lbGallery = items.filter(i => ITEM_IMAGES[i.id]).map(i => i.id);
    lbIndex = lbGallery.indexOf(id);
    if (lbIndex === -1) return;
    renderLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function renderLightbox(){
    const id = lbGallery[lbIndex];
    const item = items.find(x => x.id === id);
    if (!item) return;
    document.getElementById('lbImg').src = ITEM_IMAGES[id];
    document.getElementById('lbTitle').textContent = item.title;
    document.getElementById('lbPrice').textContent = item.priceTo ? money(item.price) + '–' + money(item.priceTo) : money(item.price);
    document.getElementById('lbCount').textContent = `${lbIndex + 1} / ${lbGallery.length} · blättern mit ← →`;
    const link = document.getElementById('lbLink');
    if (item.link){ link.href = item.link; link.style.display = ''; }
    else { link.style.display = 'none'; }
    updateLightboxCheck();
  }
  function updateLightboxCheck(){
    if (lbIndex < 0) return;
    const btn = document.getElementById('lbCheck');
    const done = purchased.has(lbGallery[lbIndex]);
    btn.classList.toggle('done', done);
    btn.textContent = done ? '✓ Erledigt' : 'Abhaken';
  }
  function lbToggleCheck(){
    if (lbIndex < 0) return;
    togglePurchased(lbGallery[lbIndex]);
  }
  function lbNav(dir){
    if (lbIndex < 0 || lbGallery.length === 0) return;
    lbIndex = (lbIndex + dir + lbGallery.length) % lbGallery.length;
    renderLightbox();
  }
  function closeLightbox(){
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('open')) return;
    lb.classList.remove('open');
    lbIndex = -1;
    document.body.style.overflow = '';
  }
  document.getElementById('lightbox').addEventListener('click', function(e){
    if (e.target === this) closeLightbox();
  });

  // --- Tastatur: / fokussiert die Suche, Esc schließt/leert, Pfeile blättern ---
  document.addEventListener('keydown', function(e){
    const lbOpen = document.getElementById('lightbox').classList.contains('open');
    const ae = document.activeElement;
    const inInput = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if (e.key === 'Escape'){
      if (lbOpen){ closeLightbox(); return; }
      if (inInput && ae.id === 'searchBox'){
        ae.value = ''; onSearch(); ae.blur();
      }
      return;
    }
    if (lbOpen){
      if (e.key === 'ArrowRight'){ e.preventDefault(); lbNav(1); }
      else if (e.key === 'ArrowLeft'){ e.preventDefault(); lbNav(-1); }
      return;
    }
    if (e.key === '/' && !inInput){
      e.preventDefault();
      document.getElementById('searchBox').focus();
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.classList.contains('group-header')){
      e.preventDefault();
      document.activeElement.click();
    }
  });

  // --- Scroll-Reveal ---
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const revealObserver = (prefersReduced || !('IntersectionObserver' in window)) ? null :
    new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){ en.target.classList.add('in'); revealObserver.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
  function armReveal(){
    if (!revealObserver) return;
    document.getElementById('lists').querySelectorAll('.card, .group-header, .dream-project, .category-head').forEach(function(el){
      if (el.classList.contains('reveal')) return;
      el.classList.add('reveal');
      revealObserver.observe(el);
      // Sicherheitsnetz: falls der Observer nicht feuert (Headless/Randfälle),
      // wird die Karte nach kurzer Zeit trotzdem sichtbar gemacht.
      setTimeout(function(){ if (!el.classList.contains('in')) el.classList.add('in'); }, 1400);
    });
  }
  document.addEventListener('animationend', function(e){
    if (e.animationName === 'cardIn') e.target.classList.remove('reveal', 'in');
  });
  new MutationObserver(armReveal).observe(document.getElementById('lists'), { childList: true });
  armReveal();
</script>

</body>
